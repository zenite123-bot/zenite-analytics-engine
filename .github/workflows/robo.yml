name: Robô Alimentador Zenite

on:
  schedule:
    - cron: '0 9 * * *'  # Roda às 06:00 horário de Brasília
  workflow_dispatch:

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar o ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv supabase

      - name: Executar o Robô
        env:
          URL_SUPABASE: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python robo_alimentador.py
