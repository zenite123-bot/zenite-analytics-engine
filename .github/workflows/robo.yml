name: Robo Alimentador Zênite

on:
  schedule:
    # Roda todos os dias às 09:00 UTC (06:00 horário de Brasília)
    - cron: '0 9 * * *'
  workflow_dispatch: # Cria um botão no GitHub para você rodar manualmente quando quiser

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Preparar o ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas necessárias
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv

    - name: Executar o Robô
      env:
        # Conecta as chaves do GitHub ao nosso código Python
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        python robo_alimentador.py
